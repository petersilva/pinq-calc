[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinq-calc"
version = "0.0.1"
authors = [
  { name="Peter", email="peter@bsqt.homeip.net" },
]
description = "Pinq-calc (Python Interpreter Nifty Qt Calculator) - A portable GUI calculator with an integrated Python terminal."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "PySide6>=6.0.0",
]

[project.urls]
"Homepage" = "https://github.com/petersilva/pinq-calc"

[project.scripts]
pinq-calc = "pinq.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pinq = ["*.md", "*.jpeg", "*.jpg", "*.png"]
